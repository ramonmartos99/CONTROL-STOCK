<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>AMG · Control de Cestos</title>
<style>
  :root{
    --verde-900:#0f3d24;
    --verde-800:#155c33;
    --verde-700:#1c7a41;
    --verde-600:#238f4d;
    --verde-500:#2fae5f;
    --verde-100:#e4f4ea;
    --verde-050:#f2f9f4;
    --carbon-900:#20242a;
    --carbon-700:#3a4048;
    --carbon-500:#5c636c;
    --carbon-300:#9aa1a9;
    --carbon-100:#e7e9eb;
    --paper:#fbfaf7;
    --amber:#d98c2b;
    --red:#c0392b;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(15,61,36,.08);
    --shadow-md:0 6px 20px rgba(15,61,36,.14);
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--carbon-900);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }

  /* subtle mesh texture background, evocative of wire baskets */
  .mesh-bg{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(var(--carbon-100) 1px, transparent 1px),
      linear-gradient(90deg, var(--carbon-100) 1px, transparent 1px);
    background-size:26px 26px;
    opacity:.5;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,0) 480px);
  }

  a{color:inherit;}

  /* ---------- HEADER ---------- */
  header.top{
    background:linear-gradient(155deg, var(--verde-900) 0%, var(--verde-700) 62%, var(--verde-600) 100%);
    color:#fff;
    padding:22px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; right:-60px; top:-60px; width:220px; height:220px;
    background:radial-gradient(circle, rgba(255,255,255,.10) 0%, transparent 70%);
  }
  .top-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .logo-wrap{
    background:#fff;
    border-radius:8px;
    padding:8px 14px;
    box-shadow:var(--shadow-md);
    flex-shrink:0;
  }
  .logo-wrap img{display:block; height:38px; width:auto;}
  .top-text{flex:1; min-width:200px;}
  .top-text h1{
    margin:0; font-size:1.5rem; font-weight:800; letter-spacing:.2px;
  }
  .top-text p{
    margin:4px 0 0; font-size:.82rem; color:rgba(255,255,255,.82);
    font-family:var(--mono); letter-spacing:.3px;
  }
  .top-meta{
    display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;
  }
  .meta-chip{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    border-radius:6px;
    padding:6px 10px;
    font-size:.72rem;
    font-family:var(--mono);
    color:#eafcef;
  }
  .meta-chip b{color:#fff; font-weight:700;}

  .sync-badge{
    max-width:1080px; margin:14px auto 0; padding:0 20px;
    display:flex; align-items:center; gap:7px;
    font-size:.74rem; color:rgba(255,255,255,.85); font-family:var(--mono);
    position:relative; z-index:2;
  }
  .sync-badge .dot{
    width:8px; height:8px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 0 0 rgba(217,140,43,.6);
    animation:pulse 1.4s infinite;
  }
  .sync-badge.live .dot{background:#4ee08a; box-shadow:0 0 0 0 rgba(78,224,138,.6);}
  .sync-badge.offline .dot{background:#e05a4e; animation:none;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,.35);}
    70%{box-shadow:0 0 0 7px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
  }

  /* ---------- SEARCH ---------- */
  .search-zone{
    max-width:1080px; margin:-18px auto 0; padding:0 20px;
    position:relative; z-index:5;
  }
  .search-box{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow-md);
    display:flex; align-items:center;
    padding:2px;
    border:1px solid var(--carbon-100);
  }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    padding:14px 16px; font-size:.95rem; font-family:inherit; color:var(--carbon-900);
  }
  .search-box .icon{padding:0 12px; color:var(--verde-700); font-size:1.1rem;}
  .search-box button.clear{
    border:none; background:none; color:var(--carbon-300);
    font-size:1.2rem; padding:6px 14px; cursor:pointer; display:none;
  }
  .search-results{
    max-width:1080px; margin:10px auto 0; padding:0 20px;
  }
  .search-results-list{
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm);
    border:1px solid var(--carbon-100); overflow:hidden;
  }
  .sr-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 16px; border-bottom:1px solid var(--carbon-100);
    cursor:pointer; transition:background .12s;
  }
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:var(--verde-050);}
  .sr-badge{
    background:var(--verde-700); color:#fff; font-family:var(--mono); font-weight:700;
    font-size:.72rem; padding:4px 8px; border-radius:5px; flex-shrink:0;
  }
  .sr-main{flex:1; min-width:0;}
  .sr-ref{font-family:var(--mono); font-size:.72rem; color:var(--verde-700); font-weight:700;}
  .sr-desc{font-size:.88rem; color:var(--carbon-900); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sr-empty{padding:24px; text-align:center; color:var(--carbon-300); font-size:.9rem;}

  /* ---------- STATS BAR ---------- */
  .stats-bar{
    max-width:1080px; margin:18px auto 0; padding:0 20px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  }
  .stat-card{
    background:#fff; border:1px solid var(--carbon-100); border-radius:var(--radius);
    padding:12px 14px; text-align:left;
  }
  .stat-card .n{font-size:1.35rem; font-weight:800; color:var(--verde-800); font-family:var(--mono);}
  .stat-card .l{font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; color:var(--carbon-500); margin-top:2px;}
  @media (max-width:640px){
    .stats-bar{grid-template-columns:repeat(2,1fr);}
  }

  /* ---------- GRID SECTION ---------- */
  .section{max-width:1080px; margin:26px auto 0; padding:0 20px;}
  .section-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;
  }
  .section-head h2{
    font-size:1.05rem; margin:0; color:var(--carbon-900); font-weight:800;
  }
  .section-head h2 span{color:var(--verde-700);}
  .btn{
    border:none; border-radius:7px; padding:9px 14px; font-size:.82rem; font-weight:700;
    cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px;
    transition:transform .08s, box-shadow .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--verde-700); color:#fff; box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--verde-800);}
  .btn-ghost{background:var(--carbon-100); color:var(--carbon-700);}
  .btn-ghost:hover{background:var(--carbon-300); color:#fff;}
  .btn-danger{background:#fce9e6; color:var(--red);}
  .btn-danger:hover{background:var(--red); color:#fff;}
  .btn-sm{padding:6px 10px; font-size:.74rem;}

  .cesto-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(108px,1fr));
    gap:10px;
  }
  .cesto-card{
    aspect-ratio:1/1;
    border-radius:9px;
    border:1.5px solid var(--verde-100);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 6px, rgba(28,122,65,.05) 6px, rgba(28,122,65,.05) 7px),
      repeating-linear-gradient(90deg, transparent, transparent 6px, rgba(28,122,65,.05) 6px, rgba(28,122,65,.05) 7px),
      #fff;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
    transition:transform .12s, box-shadow .12s, border-color .12s;
  }
  .cesto-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-md);
    border-color:var(--verde-500);
  }
  .cesto-card .num{
    font-family:var(--mono); font-weight:800; font-size:1.5rem; color:var(--verde-800); line-height:1;
  }
  .cesto-card .tag{
    font-size:.62rem; text-transform:uppercase; letter-spacing:.6px; color:var(--carbon-500); margin-top:5px;
  }
  .cesto-card .count-dot{
    position:absolute; top:8px; right:8px;
    background:var(--verde-700); color:#fff; font-family:var(--mono);
    font-size:.62rem; font-weight:700; min-width:18px; height:18px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .cesto-card.empty{
    border-style:dashed; border-color:var(--carbon-300); background:var(--paper);
  }
  .cesto-card.empty .num{color:var(--carbon-300);}
  .cesto-card.empty .tag{color:var(--carbon-300);}

  /* ---------- DETAIL VIEW (drawer) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,25,20,.5);
    z-index:40; display:none; backdrop-filter:blur(1px);
  }
  .overlay.show{display:block;}
  .drawer{
    position:fixed; top:0; right:0; height:100%;
    width:min(560px, 100%);
    background:var(--paper);
    z-index:50;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.3,1);
    display:flex; flex-direction:column;
    box-shadow:-8px 0 30px rgba(0,0,0,.25);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{
    background:linear-gradient(135deg, var(--verde-800), var(--verde-600));
    color:#fff; padding:18px 20px; flex-shrink:0;
  }
  .drawer-head-top{display:flex; align-items:center; justify-content:space-between;}
  .drawer-head-top h2{margin:0; font-size:1.3rem; font-family:var(--mono);}
  .drawer-close{
    background:rgba(255,255,255,.18); border:none; color:#fff; width:32px; height:32px;
    border-radius:50%; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .drawer-head-sub{margin-top:6px; font-size:.78rem; color:rgba(255,255,255,.85);}
  .drawer-actions{
    padding:12px 20px; display:flex; gap:8px; border-bottom:1px solid var(--carbon-100);
    background:#fff; flex-shrink:0; flex-wrap:wrap;
  }
  .drawer-body{
    flex:1; overflow-y:auto; padding:14px 16px 90px;
  }
  .perfil-card{
    background:#fff; border:1px solid var(--carbon-100); border-radius:9px;
    padding:12px 14px; margin-bottom:10px; position:relative;
  }
  .perfil-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .perfil-ref{
    font-family:var(--mono); font-weight:800; font-size:.76rem; color:#fff;
    background:var(--verde-700); padding:2px 7px; border-radius:5px; display:inline-block;
  }
  .perfil-desc{font-size:.92rem; font-weight:600; margin:6px 0 8px; color:var(--carbon-900);}
  .perfil-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:.74rem; color:var(--carbon-500);
  }
  .perfil-grid .f-label{text-transform:uppercase; letter-spacing:.4px; font-size:.62rem; color:var(--carbon-300);}
  .perfil-grid .f-val{color:var(--carbon-700); font-weight:600;}
  .perfil-grid .swatch{
    display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px;
    background:var(--carbon-300); vertical-align:middle;
  }
  .qty-row{
    display:flex; align-items:center; gap:6px; margin-top:10px;
    padding-top:10px; border-top:1px dashed var(--carbon-100);
  }
  .qty-row .f-label{font-size:.62rem; text-transform:uppercase; color:var(--carbon-300); margin-right:4px;}
  .qty-btn{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--carbon-100);
    background:var(--verde-050); color:var(--verde-800); font-weight:800; cursor:pointer; font-size:.95rem;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-val{
    font-family:var(--mono); font-weight:800; min-width:28px; text-align:center; font-size:.9rem;
  }
  .perfil-del{
    position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer;
    color:var(--carbon-300); font-size:1rem; padding:4px;
  }
  .perfil-del:hover{color:var(--red);}
  .drawer-empty{
    text-align:center; padding:50px 20px; color:var(--carbon-300);
  }
  .drawer-empty .big{font-size:2.4rem;}

  /* ---------- FORM MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,25,20,.55); z-index:60;
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:12px; width:100%; max-width:420px;
    max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-md);
  }
  .modal-head{
    background:var(--verde-700); color:#fff; padding:16px 20px; border-radius:12px 12px 0 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{margin:0; font-size:1rem;}
  .modal-body{padding:18px 20px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.4px;
    color:var(--carbon-500); margin-bottom:5px; font-weight:700;
  }
  .field input{
    width:100%; padding:10px 12px; border:1px solid var(--carbon-100); border-radius:7px;
    font-size:.9rem; font-family:inherit; outline:none; transition:border-color .12s;
  }
  .field input:focus{border-color:var(--verde-500);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-foot{padding:6px 20px 20px; display:flex; gap:8px; justify-content:flex-end;}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--carbon-900); color:#fff; padding:11px 20px; border-radius:8px;
    font-size:.84rem; z-index:80; opacity:0; pointer-events:none; transition:all .25s;
    box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer.foot{
    max-width:1080px; margin:34px auto 0; padding:16px 20px; text-align:center;
    font-size:.72rem; color:var(--carbon-300);
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--carbon-100); border-radius:4px;}
</style>
</head>

const fbApp = initializeApp(FIREBASE_CONFIG);

let state = { data:{}, meta: EMBEDDED.meta, maxNum: EMBEDDED.maxNum };
let currentCesto = null;
let hasFirstSnapshot = false;

/* ---- Sync badge ---- */
function setSyncBadge(mode, text){
  const badge = document.getElementById('syncBadge');
  badge.classList.remove('live','offline');
  if(mode) badge.classList.add(mode);
  document.getElementById('syncText').textContent = text;
}

/* ---- Firestore: seed once if empty, then listen live ---- */
async function ensureSeeded(){
  try{
    const snap = await getDocs(cestosCol);
    if(!snap.empty) return;
    const batch = writeBatch(db);
    Object.keys(EMBEDDED.data).forEach(num=>{
      batch.set(doc(db,'cestos', num), { items: EMBEDDED.data[num] });
    });
    await batch.commit();
  }catch(e){
    console.error('Error al inicializar datos:', e);
    setSyncBadge('offline','Error al conectar con la base de datos');
  }
}

function listenToCestos(){
  onSnapshot(cestosCol, { includeMetadataChanges:true }, (snap)=>{
    const newData = {};
    snap.forEach(d=>{ newData[d.id] = (d.data().items)||[]; });
    state.data = newData;
    hasFirstSnapshot = true;
    renderGrid();
    renderStats();
    if(currentCesto !== null) renderDrawerBody();
    const q = document.getElementById('searchInput').value;
    if(q) doSearch(q);
    setSyncBadge(snap.metadata.fromCache ? 'offline' : 'live',
      snap.metadata.fromCache ? 'Sin conexión · mostrando última copia' : 'Sincronizado en tiempo real');
  }, (err)=>{
    console.error(err);
    setSyncBadge('offline','Error de conexión con la nube');
  });
}

async function persistCesto(num){
  try{
    await setDoc(doc(db,'cestos', String(num)), { items: state.data[num] || [], updatedAt: serverTimestamp() });
  }catch(e){
    console.error(e);
    showToast('No se pudo guardar en la nube — revisa tu conexión');
  }
}

async function init(){
  renderMeta();
  bindEvents();
  setSyncBadge(null,'Conectando…');
  await ensureSeeded();
  listenToCestos();
}

function renderMeta(){
  const m = state.meta;
  document.getElementById('metaChips').innerHTML = `
    <div class="meta-chip">CLIENTE <b>${m.codigo}</b></div>
    <div class="meta-chip">FECHA <b>${m.fecha}</b></div>
    <div class="meta-chip">VALORACIÓN <b>${m.valoracion}</b></div>
  `;
}

function allCestoNumbers(){
  const keys = Object.keys(state.data).map(Number);
  const max = Math.max(state.maxNum, ...keys, 0);
  const nums = [];
  for(let i=1;i<=max;i++) nums.push(i);
  // also include any numbers beyond max that exist as keys
  keys.forEach(k=>{ if(!nums.includes(k)) nums.push(k); });
  return nums.sort((a,b)=>a-b);
}

function renderStats(){
  const nums = Object.keys(state.data);
  let totalRefs = 0, totalPiezas = 0, cestosConDatos = 0;
  nums.forEach(n=>{
    const items = state.data[n];
    if(items.length>0) cestosConDatos++;
    totalRefs += items.length;
    items.forEach(it=>{ totalPiezas += parseInt(it.cantidad)||0; });
  });
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="n">${cestosConDatos}</div><div class="l">Cestos con material</div></div>
    <div class="stat-card"><div class="n">${totalRefs}</div><div class="l">Referencias distintas</div></div>
    <div class="stat-card"><div class="n">${totalPiezas}</div><div class="l">Piezas totales</div></div>
    <div class="stat-card"><div class="n">${allCestoNumbers().length}</div><div class="l">Cestos numerados</div></div>
  `;
}

function renderGrid(){
  const nums = allCestoNumbers();
  document.getElementById('gridCount').textContent = `(${nums.length})`;
  const grid = document.getElementById('cestoGrid');
  grid.innerHTML = nums.map(n=>{
    const items = state.data[n] || [];
    const empty = items.length===0;
    return `
      <div class="cesto-card ${empty?'empty':''}" data-num="${n}">
        ${!empty ? `<div class="count-dot">${items.length}</div>` : ''}
        <div class="num">${n}</div>
        <div class="tag">${empty ? 'vacío' : 'cesto'}</div>
      </div>
    `;
  }).join('');
  grid.querySelectorAll('.cesto-card').forEach(card=>{
    card.addEventListener('click', ()=> openCesto(parseInt(card.dataset.num)));
  });
}

function openCesto(num){
  currentCesto = num;
  if(!state.data[num]) state.data[num] = [];
  document.getElementById('drawerTitle').textContent = `CESTO ${num}`;
  renderDrawerBody();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  currentCesto = null;
}

function renderDrawerBody(){
  const items = state.data[currentCesto] || [];
  document.getElementById('drawerSub').textContent = `${items.length} referencia${items.length!==1?'s':''} · ${items.reduce((s,i)=>s+(parseInt(i.cantidad)||0),0)} piezas`;
  const body = document.getElementById('drawerBody');
  if(items.length===0){
    body.innerHTML = `<div class="drawer-empty"><div class="big">📦</div><p>Este cesto está vacío.<br>Añade un perfil para empezar.</p></div>`;
    return;
  }
  body.innerHTML = items.map(it=>perfilCardHtml(it)).join('');
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>deletePerfil(b.dataset.del)));
  body.querySelectorAll('[data-qtyminus]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.qtyminus,-1)));
  body.querySelectorAll('[data-qtyplus]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.qtyplus,1)));
}

function perfilCardHtml(it){
  const hasSecond = it.acabado2 || it.matiz2;
  return `
    <div class="perfil-card">
      <button class="perfil-del" data-del="${it.id}" title="Eliminar perfil">🗑</button>
      <div class="perfil-top">
        <span class="perfil-ref">REF ${escapeHtml(it.ref||'—')}</span>
      </div>
      <div class="perfil-desc">${escapeHtml(it.desc||'Sin descripción')}</div>
      <div class="perfil-grid">
        <div><span class="f-label">Longitud</span><br><span class="f-val">${escapeHtml(it.longitud||'—')} mm</span></div>
        <div><span class="f-label">Acabado 1</span><br><span class="f-val"><span class="swatch"></span>${escapeHtml(it.acabado1||'—')}</span></div>
        <div><span class="f-label">Matiz 1</span><br><span class="f-val">${escapeHtml(it.matiz1||'—')}</span></div>
        ${hasSecond ? `<div><span class="f-label">Acabado 2</span><br><span class="f-val"><span class="swatch"></span>${escapeHtml(it.acabado2||'—')}</span></div>
        <div><span class="f-label">Matiz 2</span><br><span class="f-val">${escapeHtml(it.matiz2||'—')}</span></div>` : ''}
      </div>
      <div class="qty-row">
        <span class="f-label">Cantidad</span>
        <button class="qty-btn" data-qtyminus="${it.id}">−</button>
        <span class="qty-val">${it.cantidad||0}</span>
        <button class="qty-btn" data-qtyplus="${it.id}">+</button>
      </div>
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function findItem(id){
  const items = state.data[currentCesto] || [];
  return items.find(i=>i.id===id);
}

function changeQty(id, delta){
  const it = findItem(id);
  if(!it) return;
  const cur = parseInt(it.cantidad)||0;
  it.cantidad = Math.max(0, cur+delta);
  renderDrawerBody();
  renderStats();
  persistCesto(currentCesto);
}

function deletePerfil(id){
  if(!confirm('¿Eliminar este perfil del cesto?')) return;
  const num = currentCesto;
  state.data[num] = (state.data[num]||[]).filter(i=>i.id!==id);
  renderDrawerBody();
  renderGrid();
  renderStats();
  showToast('Perfil eliminado');
  persistCesto(num);
}

function emptyCesto(){
  if(!confirm(`¿Vaciar por completo el cesto ${currentCesto}? Esta acción no se puede deshacer.`)) return;
  const num = currentCesto;
  state.data[num] = [];
  renderDrawerBody();
  renderGrid();
  renderStats();
  showToast('Cesto vaciado');
  persistCesto(num);
}

/* ---- Add perfil modal ---- */
function openAddModal(){
  ['f_ref','f_desc','f_longitud','f_cantidad','f_acabado1','f_matiz1','f_acabado2','f_matiz2'].forEach(id=>{
    document.getElementById(id).value='';
  });
  document.getElementById('f_cantidad').value = 1;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeAddModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
function saveNewPerfil(){
  const ref = document.getElementById('f_ref').value.trim();
  const desc = document.getElementById('f_desc').value.trim();
  if(!ref && !desc){ showToast('Indica al menos referencia o descripción'); return; }
  const item = {
    id: currentCesto+'-'+Date.now()+'-'+Math.floor(Math.random()*1000),
    ref: ref,
    desc: desc,
    longitud: document.getElementById('f_longitud').value.trim(),
    cantidad: parseInt(document.getElementById('f_cantidad').value)||0,
    acabado1: document.getElementById('f_acabado1').value.trim(),
    matiz1: document.getElementById('f_matiz1').value.trim(),
    acabado2: document.getElementById('f_acabado2').value.trim(),
    matiz2: document.getElementById('f_matiz2').value.trim(),
  };
  const num = currentCesto;
  if(!state.data[num]) state.data[num] = [];
  state.data[num].push(item);
  closeAddModal();
  renderDrawerBody();
  renderGrid();
  renderStats();
  showToast('Perfil añadido');
  persistCesto(num);
}

}
function closeNewCestoModal(){
  document.getElementById('newCestoOverlay').classList.remove('show');

function createNewCesto(){
  const n = parseInt(document.getElementById('f_newcesto').value);
  if(!n || n<1){ showToast('Introduce un número de cesto válido'); return; }
  if(!state.data[n]) state.data[n] = [];
  if(n > state.maxNum) state.maxNum = n;
  closeNewCestoModal();
  renderGrid();
  renderStats();
  openCesto(n);
  persistCesto(n);
}

/* ---- Search ---- */
function doSearch(q){
  q = q.trim().toLowerCase();
  const zone = document.getElementById('searchResultsZone');
  const list = document.getElementById('searchResultsList');
  const gridSection = document.getElementById('gridSection');
  document.getElementById('clearSearch').style.display = q ? 'block' : 'none';
  if(!q){
    zone.style.display='none';
    gridSection.style.display='block';
    return;
  }
  gridSection.style.display='none';
  zone.style.display='block';
  const results = [];
  Object.keys(state.data).forEach(n=>{
    (state.data[n]||[]).forEach(it=>{
      const hay = [it.ref,it.desc,it.acabado1,it.matiz1,it.acabado2,it.matiz2].join(' ').toLowerCase();
      if(hay.includes(q)) results.push({cesto:n, item:it});
    });
  });
  if(results.length===0){
    list.innerHTML = `<div class="sr-empty">Sin resultados para “${escapeHtml(q)}”</div>`;
    return;
  }
  list.innerHTML = results.slice(0,150).map(r=>`
    <div class="sr-item" data-cesto="${r.cesto}">
      <span class="sr-badge">C${r.cesto}</span>
      <div class="sr-main">
        <div class="sr-ref">REF ${escapeHtml(r.item.ref||'—')} · ${escapeHtml(r.item.acabado1||'')} ${escapeHtml(r.item.matiz1||'')}</div>
        <div class="sr-desc">${escapeHtml(r.item.desc||'Sin descripción')}</div>
      </div>
    </div>
  `).join('') + (results.length>150 ? `<div class="sr-empty">Mostrando 150 de ${results.length} resultados…</div>` : '');
  list.querySelectorAll('.sr-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      openCesto(parseInt(el.dataset.cesto));
      document.getElementById('searchInput').value='';
      doSearch('');
    });
  });
}

/* ---- Toast ---- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function bindEvents(){
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('overlay').addEventListener('click', closeDrawer);
  document.getElementById('btnAddPerfil').addEventListener('click', openAddModal);
  document.getElementById('btnEmptyCesto').addEventListener('click', emptyCesto);
  document.getElementById('modalClose').addEventListener('click', closeAddModal);
  document.getElementById('btnCancelModal').addEventListener('click', closeAddModal);
  document.getElementById('btnSaveModal').addEventListener('click', saveNewPerfil);
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeAddModal(); });

  document.getElementById('btnNewCesto').addEventListener('click', openNewCestoModal);
  document.getElementById('newCestoClose').addEventListener('click', closeNewCestoModal);
  document.getElementById('btnCancelNewCesto').addEventListener('click', closeNewCestoModal);
  document.getElementById('btnCreateCesto').addEventListener('click', createNewCesto);
  document.getElementById('newCestoOverlay').addEventListener('click', (e)=>{ if(e.target.id==='newCestoOverlay') closeNewCestoModal(); });

  document.getElementById('searchInput').addEventListener('input', (e)=>doSearch(e.target.value));
  document.getElementById('clearSearch').addEventListener('click', ()=>{
    document.getElementById('searchInput').value='';
    doSearch('');
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){
      closeDrawer(); closeAddModal(); closeNewCestoModal();
    }
  });
}

init();
</script>
